name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build with preview base path
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
        run: npm run build

      # Deploys to gh-pages under pr-preview/pr-<number>/, posts/updates a
      # sticky comment with the URL on the PR, and removes the preview when
      # the PR is closed.
      - name: Deploy preview
        id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist

      - name: Write job summary
        if: github.event.action != 'closed'
        run: |
          {
            echo "### 🔎 PR preview deployed"
            echo ""
            echo "Preview for this PR: <${{ steps.preview.outputs.deployment-url }}>"
          } >> "$GITHUB_STEP_SUMMARY"
